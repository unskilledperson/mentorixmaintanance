<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <!-- Realistic 3D Cast Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#102238" flood-opacity="0.25" />
    </filter>

    <!-- Gradients for Ribbon 1 (Soft Sky Blue) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2d6f8" />
      <stop offset="50%" stop-color="#90bce7" />
      <stop offset="100%" stop-color="#73a5db" />
    </linearGradient>

    <!-- Gradients for Ribbon 2 (Vibrant Azure Blue) -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa4f6" />
      <stop offset="50%" stop-color="#258be6" />
      <stop offset="100%" stop-color="#146ecb" />
    </linearGradient>

    <!-- Text Navy Gradient -->
    <linearGradient id="navyTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22426c" />
      <stop offset="100%" stop-color="#183354" />
    </linearGradient>
  </defs>

  <!-- LOGO ICON (Double Rounded Fold Ribbons) -->
  <g id="logo-icon-group" filter="url(#logoShadow)">
    
    <!-- LEFT RIBBON (Sky Blue) -->
    <!-- 3D Bevel Underside -->
    <path d="M 28 68 L 34 74 L 56 106 C 62 114 74 114 80 106 L 80 98 C 74 108 62 108 54 98 Z" fill="#5885b5" />
    <!-- Front Face -->
    <path d="M 28 66 C 18 54 26 34 44 24 C 60 14 78 22 90 36 L 56 86 C 50 94 38 94 30 86 C 24 80 28 72 36 68 Z" fill="url(#skyGrad)" />
    <!-- Vertical Arch Leg -->
    <path d="M 32 64 L 54 96 C 60 104 72 104 78 96 L 108 48 C 114 38 106 28 96 32 C 86 34 80 44 76 52 L 54 84 C 48 90 42 90 38 84 L 28 70 Z" fill="url(#skyGrad)" />

    <!-- RIGHT RIBBON (Azure Blue) -->
    <!-- 3D Bevel Underside -->
    <path d="M 98 70 L 104 76 L 126 108 C 132 116 144 116 150 108 L 150 100 C 144 110 132 110 124 100 Z" fill="#0f559f" />
    <!-- Front Face -->
    <path d="M 96 58 C 86 46 94 26 112 16 C 128 6 146 14 158 28 L 188 72 C 196 84 188 102 172 110 C 156 118 140 110 132 98 L 114 72 Z" fill="url(#azureGrad)" />
    <!-- Vertical Arch Leg -->
    <path d="M 98 54 L 120 86 C 126 94 138 94 144 86 L 178 38 C 184 28 176 18 166 22 C 156 24 150 34 146 42 L 124 74 C 118 80 112 80 108 74 L 98 60 Z" fill="url(#azureGrad)" />

  </g>

  <!-- 3D BLOCK TYPOGRAPHY (Deep Navy) -->
  <g id="brand-text-group" transform="translate(210, 8)" filter="url(#logoShadow)">
    
    <!-- MENTORIX 3D Depth Layer -->
    <text x="3" y="65" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#0c1d33">MENTORIX</text>
    <text x="2" y="64" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#112642">MENTORIX</text>
    <text x="1" y="63" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#163154">MENTORIX</text>
    <!-- MENTORIX Front Face -->
    <text x="0" y="62" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="url(#navyTextGrad)">MENTORIX</text>

    <!-- INSTITUTE 3D Depth Layer -->
    <text x="3" y="139" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#0c1d33">INSTITUTE</text>
    <text x="2" y="138" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#112642">INSTITUTE</text>
    <text x="1" y="137" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="#163154">INSTITUTE</text>
    <!-- INSTITUTE Front Face -->
    <text x="0" y="136" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="900" letter-spacing="0.04em" fill="url(#navyTextGrad)">INSTITUTE</text>

  </g>
</svg>
